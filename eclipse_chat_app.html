<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            eclipse: { 500: '#6366f1', 600: '#4f46e5', 950: '#0b0e14' },
            darkCard: '#151a23',
            darkBorder: '#1f2937'
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #0b0e14; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .tab-active { color: #818cf8 !important; border-top: 2.5px solid #6366f1; background: rgba(99, 102, 241, 0.08); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
  </style>
</head>
<body class="select-none">

  <!-- TOAST NOTIFICATIONS -->
  <div id="toastContainer" class="fixed top-4 right-4 left-4 sm:left-auto sm:w-96 z-50 pointer-events-none flex flex-col gap-2"></div>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="flex-1 flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-sm bg-[#151a23] border border-[#1f2937] rounded-3xl p-6 shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-indigo-600 rounded-full mx-auto flex items-center justify-center text-2xl font-bold mb-3 shadow-lg">E</div>
        <h2 class="text-xl font-bold text-white">Eclipse Chat</h2>
        <p class="text-xs text-slate-400 mt-1">iPad & Cloud Connected</p>
      </div>

      <div class="flex bg-[#0b0e14] p-1 rounded-xl mb-4 border border-[#1f2937]">
        <button id="tabLogin" onclick="switchAuth('login')" class="flex-1 py-2 text-xs font-bold rounded-lg text-white bg-indigo-600">Login</button>
        <button id="tabSignup" onclick="switchAuth('signup')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400">Sign Up</button>
      </div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">USERNAME</label>
          <input type="text" id="authUsername" required placeholder="e.g. Alex" class="w-full px-3 py-2.5 bg-[#0b0e14] border border-[#1f2937] rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">PASSWORD (6-20 chars)</label>
          <input type="password" id="authPassword" required minlength="6" maxlength="20" placeholder="••••••••" class="w-full px-3 py-2.5 bg-[#0b0e14] border border-[#1f2937] rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold text-white text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition-all">
          Sign In / Register
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer" class="flex-1 flex flex-col max-w-3xl w-full mx-auto h-full hidden border-x border-[#1f2937]">
    
    <!-- HEADER -->
    <header class="h-14 bg-[#151a23] border-b border-[#1f2937] px-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs">E</div>
        <div>
          <h1 class="text-xs font-bold text-white uppercase tracking-wider" id="headerTitle">Global Lounge</h1>
          <p class="text-[10px] text-emerald-400">Cloud Online</p>
        </div>
      </div>
      <button onclick="logout()" class="w-8 h-8 rounded-xl bg-[#0b0e14] border border-[#1f2937] text-slate-400 hover:text-white flex items-center justify-center text-xs">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </header>

    <!-- CONTENT VIEWS -->
    <main class="flex-1 flex flex-col min-h-0 relative">
      
      <!-- TAB 1: GLOBAL -->
      <section id="viewGlobal" class="flex-1 flex flex-col h-full min-h-0">
        <div id="globalFeed" class="flex-1 overflow-y-auto p-3 space-y-2.5 flex flex-col-reverse min-h-0"></div>
        <form onsubmit="sendGlobal(event)" class="p-3 bg-[#0b0e14] border-t border-[#1f2937] flex gap-2 shrink-0">
          <input type="text" id="globalInput" required placeholder="Type in global chat..." autocomplete="off" class="flex-1 bg-[#151a23] border border-[#1f2937] rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none">
          <button type="submit" class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xs shrink-0"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
      </section>

      <!-- TAB 2: DMs & GROUPS -->
      <section id="viewDMs" class="flex-1 flex h-full min-h-0 hidden">
        <div class="w-full sm:w-72 bg-[#0b0e14] border-r border-[#1f2937] flex flex-col">
          <div class="p-3 border-b border-[#1f2937] flex justify-between items-center">
            <span class="text-xs font-bold text-slate-300">Chats</span>
            <button onclick="openGroupModal()" class="px-2 py-1 bg-indigo-600 text-white text-[10px] font-bold rounded-lg">+ Group</button>
          </div>
          <div id="dmList" class="flex-1 overflow-y-auto divide-y divide-[#1f2937]/50"></div>
        </div>
        <div id="dmChatPane" class="hidden sm:flex flex-1 flex-col bg-[#0b0e14] min-h-0">
          <div class="p-3 bg-[#151a23] border-b border-[#1f2937] flex items-center justify-between">
            <span id="dmActiveName" class="text-xs font-bold text-white">Select a chat</span>
          </div>
          <div id="dmFeed" class="flex-1 overflow-y-auto p-3 space-y-2 flex flex-col-reverse min-h-0"></div>
          <form onsubmit="sendDM(event)" class="p-3 bg-[#0b0e14] border-t border-[#1f2937] flex gap-2">
            <input type="text" id="dmInput" required placeholder="Type message..." autocomplete="off" class="flex-1 bg-[#151a23] border border-[#1f2937] rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
            <button type="submit" class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xs"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        </div>
      </section>

      <!-- TAB 3: FRIENDS -->
      <section id="viewFriends" class="flex-1 flex flex-col p-4 space-y-4 overflow-y-auto hidden">
        <div class="bg-[#151a23] border border-[#1f2937] p-3.5 rounded-2xl">
          <h3 class="text-xs font-bold text-amber-400 mb-2">ADD FRIEND BY USERNAME / EMAIL</h3>
          <div class="flex gap-2">
            <input type="text" id="friendSearch" placeholder="e.g. TestBot" class="flex-1 bg-[#0b0e14] border border-[#1f2937] rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
            <button onclick="addFriend()" class="px-3 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs">Add</button>
          </div>
        </div>
        <div class="bg-[#151a23] border border-[#1f2937] p-3.5 rounded-2xl">
          <h3 class="text-xs font-bold text-amber-400 mb-2">FRIEND REQUESTS</h3>
          <div id="requestsList" class="space-y-2"><p class="text-xs text-slate-500 text-center py-2">No pending requests.</p></div>
        </div>
        <div class="bg-[#151a23] border border-[#1f2937] p-3.5 rounded-2xl flex-1 flex flex-col min-h-0">
          <h3 class="text-xs font-bold text-indigo-400 mb-2">MY FRIENDS</h3>
          <div id="friendsList" class="flex-1 overflow-y-auto space-y-2"><p class="text-xs text-slate-500 text-center py-4">No friends added yet.</p></div>
        </div>
      </section>

      <!-- TAB 4: PROFILE -->
      <section id="viewProfile" class="flex-1 p-4 flex flex-col items-center justify-center hidden">
        <div class="bg-[#151a23] border border-[#1f2937] p-6 rounded-3xl w-full max-w-sm text-center">
          <div id="profileAvatar" class="w-20 h-20 bg-indigo-600 text-white text-3xl font-extrabold rounded-full mx-auto flex items-center justify-center mb-3 shadow-lg">?</div>
          <h2 id="profileName" class="text-xl font-bold text-white">User</h2>
          <p id="profileEmail" class="text-xs text-slate-400 mt-0.5">user@eclipse.internal</p>
          <div class="mt-4 pt-4 border-t border-[#1f2937] text-xs font-bold text-indigo-400" id="profileRole">Role: Member</div>
        </div>
      </section>

    </main>

    <!-- NAVIGATION BAR -->
    <nav class="h-14 bg-[#0b0e14] border-t border-[#1f2937] grid grid-cols-4 shrink-0">
      <button onclick="switchTab('global')" id="navGlobal" class="flex flex-col items-center justify-center text-slate-400 tab-active"><i class="fa-solid fa-earth-americas text-sm"></i><span class="text-[10px] font-bold mt-0.5">Global</span></button>
      <button onclick="switchTab('dms')" id="navDMs" class="flex flex-col items-center justify-center text-slate-400"><i class="fa-solid fa-comments text-sm"></i><span class="text-[10px] font-bold mt-0.5">DMs</span></button>
      <button onclick="switchTab('friends')" id="navFriends" class="flex flex-col items-center justify-center text-slate-400"><i class="fa-solid fa-user-group text-sm"></i><span class="text-[10px] font-bold mt-0.5">Friends</span></button>
      <button onclick="switchTab('profile')" id="navProfile" class="flex flex-col items-center justify-center text-slate-400"><i class="fa-solid fa-user text-sm"></i><span class="text-[10px] font-bold mt-0.5">Profile</span></button>
    </nav>

  </div>

  <script>
    const SUPABASE_URL = 'https://qpqnmbhqjxtgoaekvqsa.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_hMYMiWm1ihQjc7L7tQSo6w_ZmWL_Q-H';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let authMode = 'login';
    let currentActiveChat = null;
    let groupsCache = JSON.parse(localStorage.getItem('eclipse_groups') || '[]');

    function switchAuth(mode) {
      authMode = mode;
      document.getElementById('tabLogin').className = mode === 'login' ? 'flex-1 py-2 text-xs font-bold rounded-lg text-white bg-indigo-600' : 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400';
      document.getElementById('tabSignup').className = mode === 'signup' ? 'flex-1 py-2 text-xs font-bold rounded-lg text-white bg-indigo-600' : 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('authUsername').value.trim();
      const pass = document.getElementById('authPassword').value;
      const lower = username.toLowerCase().replace('@eclipse.internal', '');

      let { data: user } = await supabase.from('users').select('*').eq('username_lower', lower).single();

      if (authMode === 'login') {
        if (!user || user.password !== pass) return showToast('Invalid credentials.', 'error');
        currentUser = user;
      } else {
        if (user) return showToast('Username already taken!', 'error');
        const { data: allU } = await supabase.from('users').select('id');
        const role = (allU && allU.length === 0) || lower === 'testbot' ? 'Admin' : 'Member';
        const { data: nu } = await supabase.from('users').insert([{ username, username_lower: lower, password: pass, role }]).select().single();
        currentUser = nu;
      }
      launchApp();
    }

    function launchApp() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      switchTab('global');
      setInterval(pollData, 3000);
    }

    function logout() { location.reload(); }

    function switchTab(tab) {
      ['viewGlobal', 'viewDMs', 'viewFriends', 'viewProfile'].forEach(id => document.getElementById(id).classList.add('hidden'));
      ['navGlobal', 'navDMs', 'navFriends', 'navProfile'].forEach(id => document.getElementById(id).classList.remove('tab-active'));

      if (tab === 'global') {
        document.getElementById('viewGlobal').classList.remove('hidden');
        document.getElementById('navGlobal').classList.add('tab-active');
        document.getElementById('headerTitle').innerText = 'Global Lounge';
        renderGlobal();
      } else if (tab === 'dms') {
        document.getElementById('viewDMs').classList.remove('hidden');
        document.getElementById('navDMs').classList.add('tab-active');
        document.getElementById('headerTitle').innerText = 'DMs & Groups';
        renderDMsList();
      } else if (tab === 'friends') {
        document.getElementById('viewFriends').classList.remove('hidden');
        document.getElementById('navFriends').classList.add('tab-active');
        document.getElementById('headerTitle').innerText = 'Friends List';
        renderFriends();
      } else if (tab === 'profile') {
        document.getElementById('viewProfile').classList.remove('hidden');
        document.getElementById('navProfile').classList.add('tab-active');
        document.getElementById('headerTitle').innerText = 'User Profile';
        renderProfile();
      }
    }

    async function pollData() {
      if (!currentUser) return;
      const tab = document.querySelector('.tab-active')?.id;
      if (tab === 'navGlobal') renderGlobal();
      if (tab === 'navFriends') renderFriends();
      if (tab === 'navDMs' && currentActiveChat) renderDMMessages();
    }

    /* GLOBAL */
    async function renderGlobal() {
      const { data } = await supabase.from('global_messages').select('*').order('created_at', { ascending: false });
      const feed = document.getElementById('globalFeed');
      feed.innerHTML = (data || []).map(m => `
        <div class="flex flex-col ${m.sender_username.toLowerCase() === currentUser.username_lower ? 'items-end' : 'items-start'} mb-2">
          <span class="text-[10px] text-slate-400 font-bold mb-0.5">${escapeHTML(m.sender_username)}</span>
          <div class="max-w-[80%] px-3.5 py-2 rounded-2xl text-xs ${m.sender_username.toLowerCase() === currentUser.username_lower ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-[#151a23] text-slate-200 border border-[#1f2937] rounded-tl-none'}">${escapeHTML(m.content)}</div>
        </div>
      `).join('') || '<p class="text-xs text-slate-500 text-center py-6">No messages yet.</p>';
    }

    async function sendGlobal(e) {
      e.preventDefault();
      const input = document.getElementById('globalInput');
      if (!input.value.trim()) return;
      await supabase.from('global_messages').insert([{ sender_username: currentUser.username, content: input.value.trim() }]);
      input.value = '';
      renderGlobal();
    }

    /* FRIENDS */
    async function renderFriends() {
      const { data: reqs } = await supabase.from('friendships').select('*').eq('user_b', currentUser.username_lower).eq('status', 'pending');
      const reqList = document.getElementById('requestsList');
      reqList.innerHTML = (reqs || []).map(r => `
        <div class="flex justify-between items-center bg-[#0b0e14] p-2.5 rounded-xl border border-[#1f2937]">
          <span class="text-xs font-bold text-white">${escapeHTML(r.user_a)}</span>
          <div class="flex gap-2">
            <button onclick="respReq('${r.id}', 'accepted')" class="w-7 h-7 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-xs">✓</button>
            <button onclick="respReq('${r.id}', 'rejected')" class="w-7 h-7 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center text-xs">✕</button>
          </div>
        </div>
      `).join('') || '<p class="text-xs text-slate-500 text-center py-2">No pending requests.</p>';

      const { data: friends } = await supabase.from('friendships').select('*').or(`user_a.eq.${currentUser.username_lower},user_b.eq.${currentUser.username_lower}`).eq('status', 'accepted');
      const fList = document.getElementById('friendsList');
      fList.innerHTML = (friends || []).map(f => {
        const friend = f.user_a === currentUser.username_lower ? f.user_b : f.user_a;
        return `
          <div class="flex justify-between items-center bg-[#0b0e14] p-2.5 rounded-xl border border-[#1f2937]">
            <span class="text-xs font-bold text-white">${escapeHTML(friend)}</span>
            <button onclick="startDM('${friend}')" class="px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs font-bold">Message</button>
          </div>
        `;
      }).join('') || '<p class="text-xs text-slate-500 text-center py-4">No friends added yet.</p>';
    }

    async function addFriend() {
      const query = document.getElementById('friendSearch').value.trim().toLowerCase().replace('@eclipse.internal', '');
      if (!query || query === currentUser.username_lower) return showToast('Invalid friend search.', 'error');
      const { data: u } = await supabase.from('users').select('*').eq('username_lower', query).single();
      if (!u) return showToast('User not found.', 'error');
      await supabase.from('friendships').insert([{ user_a: currentUser.username_lower, user_b: query, status: 'pending' }]);
      document.getElementById('friendSearch').value = '';
      showToast('Friend request sent!', 'success');
      renderFriends();
    }

    async function respReq(id, status) {
      if (status === 'accepted') await supabase.from('friendships').update({ status: 'accepted' }).eq('id', id);
      else await supabase.from('friendships').delete().eq('id', id);
      renderFriends();
    }

    /* DMS */
    async function renderDMsList() {
      const list = document.getElementById('dmList');
      const { data: friends } = await supabase.from('friendships').select('*').or(`user_a.eq.${currentUser.username_lower},user_b.eq.${currentUser.username_lower}`).eq('status', 'accepted');
      
      list.innerHTML = (friends || []).map(f => {
        const friend = f.user_a === currentUser.username_lower ? f.user_b : f.user_a;
        return `
          <div onclick="startDM('${friend}')" class="p-3 flex items-center gap-3 cursor-pointer hover:bg-[#151a23]">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">${friend[0].toUpperCase()}</div>
            <span class="text-xs font-bold text-white">${escapeHTML(friend)}</span>
          </div>
        `;
      }).join('') || '<p class="text-xs text-slate-500 text-center py-4">No friends to chat with.</p>';
    }

    function startDM(friend) {
      currentActiveChat = friend;
      document.getElementById('dmActiveName').innerText = friend;
      document.getElementById('dmChatPane').classList.remove('hidden');
      document.getElementById('dmChatPane').classList.add('flex');
      renderDMMessages();
    }

    async function renderDMMessages() {
      if (!currentActiveChat) return;
      const { data } = await supabase.from('direct_messages').select('*').or(`and(sender_username.ilike.${currentUser.username_lower},receiver_username.ilike.${currentActiveChat}),and(sender_username.ilike.${currentActiveChat},receiver_username.ilike.${currentUser.username_lower})`).order('created_at', { ascending: false });
      
      document.getElementById('dmFeed').innerHTML = (data || []).map(m => `
        <div class="flex flex-col ${m.sender_username.toLowerCase() === currentUser.username_lower ? 'items-end' : 'items-start'} mb-2">
          <div class="max-w-[80%] px-3 py-2 rounded-2xl text-xs ${m.sender_username.toLowerCase() === currentUser.username_lower ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-[#151a23] text-slate-200 border border-[#1f2937] rounded-tl-none'}">${escapeHTML(m.content)}</div>
        </div>
      `).join('') || '<p class="text-xs text-slate-500 text-center py-4">No messages yet.</p>';
    }

    async function sendDM(e) {
      e.preventDefault();
      const input = document.getElementById('dmInput');
      if (!input.value.trim() || !currentActiveChat) return;
      await supabase.from('direct_messages').insert([{ sender_username: currentUser.username, receiver_username: currentActiveChat, content: input.value.trim() }]);
      input.value = '';
      renderDMMessages();
    }

    function openGroupModal() { showToast('Group creation modal available in desktop view.', 'info'); }

    /* PROFILE */
    function renderProfile() {
      document.getElementById('profileAvatar').innerText = currentUser.username[0].toUpperCase();
      document.getElementById('profileName').innerText = currentUser.username;
      document.getElementById('profileEmail').innerText = `${currentUser.username_lower}@eclipse.internal`;
      document.getElementById('profileRole').innerText = `Role: ${currentUser.role}`;
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `p-3 rounded-xl border text-xs font-bold shadow-xl ${type === 'success' ? 'bg-emerald-950 border-emerald-600 text-emerald-200' : 'bg-[#151a23] border-[#1f2937] text-slate-200'}`;
      t.innerText = msg;
      container.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
